# =============================================================================
# BOS node config used by the Docker image (Dockerfile / docker-compose.yml).
# The image runs:  bosc node run --config /home/bos/app/config/bos-node.toml
# Database settings come from this file (DATABASE_URL is not read by node run);
# to use other credentials, mount your own file over /home/bos/app/config/bos-node.toml.
# =============================================================================

[node]
id = "node-docker-01"
name = "BOS Docker Node"
role = "all_in_one"

[network]
host = "0.0.0.0"
port = 3000
cors_origins = ["*"]

[ui]
enabled = true
static_dir = "../ui-dist"
index_file = "index.html"

[database]
# Credentials must match the postgres service in docker-compose.yml (POSTGRES_USER/PASSWORD/DB).
# Secrets management (OpenBao) comes in a later phase.
url = "postgres://postgres:bos_secure_pass_2026@postgres:5432/bos_prod"
min_pool_size = 1
max_pool_size = 10
storage_strategy = "shared_rls"
connection_timeout_seconds = 10

[defaults]
default_tenant = "DEFAULT_TENANT"
default_company = "MAIN_COMPANY"

[nas_worker]
enabled = true
poll_interval_ms = 1000
batch_size = 50
process_outbox = true
process_job_queue = true

[security]
maintenance_mode = false
emergency_username = "emergency.admin"
emergency_name = "Emergency Maintenance Administrator"
emergency_roles = ["SUPER", "Admin", "Global Admin"]
auto_fallback_on_auth_failure = true

[pages]
enabled = true
artifact_dir = "../data/page-artifacts"
compiler_workers = 0
seed_dirs = []