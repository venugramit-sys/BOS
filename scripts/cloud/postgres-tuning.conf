# ==============================================================================
# PostgreSQL 16 Enterprise Configuration for BOS Workloads
# Sized for 4-8 vCPU / 8-16 GB RAM production node
# ==============================================================================

# Memory Configuration
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 32MB
wal_buffers = 64MB

# Checkpoint & WAL Tuning (High write throughput for ERP ledgers)
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Concurrency & Connections
max_connections = 150
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# Query Planner Cost Tuning (SSD / NVMe optimized)
random_page_cost = 1.1
effective_io_concurrency = 200

# Write-Ahead Logging & Durability
wal_level = replica
synchronous_commit = on
full_page_writes = on

# Logging & Monitoring
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_duration_statement = 250 # Log queries taking longer than 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Asia/Kolkata'
timezone = 'Asia/Kolkata'

# Autovacuum Tuning (Prevent transaction ID wraparound & table bloat)
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000
