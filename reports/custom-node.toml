# =============================================================================
# BOS local development node
#   Start with:  npm run dev        (node API on :3000 + Vite UI with hot reload on :5173)
#   or:          cargo run -p bosc-cli -- node run --config nodes/dev.toml
# Relative paths are resolved from the folder containing this file (the launcher
# changes into it), hence the "../../" prefixes. Template for other nodes: bos-node.toml.
# =============================================================================

[node]
id = "node-custom-01"
name = "BOS Local Development Node"
role = "all_in_one"

[network]
host = "127.0.0.1"
port = 3100
cors_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[ui]
# Vite (npm run dev) serves the UI with hot reload on :5173 and proxies /api to this node.
# Set to true after `npm run build:ui` to serve the built UI from this node on :3000.
enabled = false
static_dir = "../../ui/dist"
index_file = "index.html"

[database]
url = "postgres://postgres:postgres@localhost:5432/my_db"  # same database as the bos-node.toml template
min_pool_size = 1
max_pool_size = 10
storage_strategy = "shared_rls"
connection_timeout_seconds = 10

[defaults]
default_tenant = "DEFAULT_TENANT"
default_company = "MAIN_COMPANY"

[nas_worker]
enabled = true
poll_interval_ms = 1000
batch_size = 50
process_outbox = true
process_job_queue = true

[security]
maintenance_mode = false
emergency_username = "emergency.admin"
emergency_name = "Emergency Maintenance Administrator"
emergency_roles = ["SUPER", "Admin", "Global Admin"]
auto_fallback_on_auth_failure = true

[pages]
enabled = true
artifact_dir = "../../data/page-artifacts"
compiler_workers = 0
seed_dirs = ["../../dist/packages"]
