[package]
name = "bosc-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
bosc-syntax = { path = "../bosc-syntax" }
bosc-analyzer = { path = "../bosc-analyzer" }
bosc-ir = { path = "../bosc-ir" }
bosc-codegen-db = { path = "../bosc-codegen-db" }
bosc-codegen-svelte = { path = "../bosc-codegen-svelte" }
sqlx.workspace = true
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
dashmap.workspace = true
axum = { workspace = true, features = ["macros"] }
tower-http.workspace = true
rust_decimal.workspace = true
sha2 = "0.10"
argon2 = "0.5"
bcrypt = { workspace = true }
crc32fast.workspace = true
memmap2.workspace = true
arc-swap.workspace = true
rquickjs = { version = "0.14", features = ["classes", "properties"] }
wasmi.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml.workspace = true


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
